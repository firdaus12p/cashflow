name: cashflow
description: Cashflow personal finance tracker app

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.18.1
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1
  fl_chart: ^0.64.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
